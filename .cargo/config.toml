# Public Cargo configuration — installed into the export as .cargo/config.toml
# by publish/transforms.sh (the dev .cargo/config.toml is not exported: it
# carries sibling-checkout [patch] redirects that only resolve in the private
# co-development layout).
#
# trust-vc builds with the Trust toolchain (rust-toolchain.toml pins
# channel = "trust"). Install aterm (https://github.com/alabsystems/aterm);
# atpkg installs Trust and links rustup's `trust` toolchain to it (`aterm pkg
# install trust` does it by hand; atpkg ships Trust for Apple-silicon macOS
# only, and no other platform has a public Trust package or supported install
# path today). That
# toolchain ships `targo`, and every build names its lane on the command line:
#
#   targo --unverified build            # build the verifier tool; no proof claim
#   targo trust check --allow-l0-gaps   # verify it (the release gate's lane)
#
# NO VERIFICATION FLAGS LIVE HERE (2026-09-28), exactly as in the dev tree.
# This file used to carry `[build] rustflags = ["-Ztrust-verify=off"]` and the
# matching `rustdocflags`, a blanket off-switch for a consumer typing a
# lane-less `cargo check`. The Trust repository's rule for consuming repos
# forbids it: never put `-Ztrust-verify=off` in `build.rustflags` — the key
# applies to every toolchain, stable rustc rejects the flag outright, and the
# authenticated Targo lane owns activation and unit scope. It also bought
# nothing on the lanes above: `targo --unverified` and `targo tippy` put
# `-Ztrust-verify=off` on every unit themselves (build scripts, libraries,
# tests and trustdoc), and `targo trust` replaces config build rustflags with
# its own policy (measured on targo 450403669 with probe crates; see
# publish/DECISIONS.md, 2026-09-28). publish/transforms.sh T2 now refuses any
# `-Ztrust` flag in this file.

[net]
git-fetch-with-cli = true
