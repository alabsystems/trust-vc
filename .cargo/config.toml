# Public Cargo configuration — installed into the export as .cargo/config.toml
# by publish/transforms.sh (the dev .cargo/config.toml is not exported: it
# carries sibling-checkout [patch] redirects that only resolve in the private
# co-development layout).
#
# trust-vc builds with the Trust toolchain (rust-toolchain.toml pins
# channel = "trust"; build it from https://github.com/alabsystems/trust, or
# register an existing stage2 with scripts/rustup-link-trust.sh). The Trust
# compiler's verification pass is fail-closed BY DEFAULT and would try to
# prove panic-freedom for every unit, including third-party build scripts.
# Building the verifier itself is not a verification run, so the pass is
# switched off per-unit here — the same off-switch dev builds inject through
# targo. Verifying trust-vc under its own toolchain remains the separate,
# explicit `targo trust-vc evidence` lane.
#
# rust-toolchain.toml pins the trust channel for every cargo invocation in
# this repo, so a stock toolchain (which rejects -Ztrust-verify as unknown)
# never sees these flags.

[build]
rustflags = ["-Ztrust-verify=off"]
rustdocflags = ["-Ztrust-verify=off"]

[net]
git-fetch-with-cli = true
