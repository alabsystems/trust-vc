# Toolchain for building the `rustc-driver` feature of trust-vc-driver.
#
# Copyright 2026 Andrew Yates
# SPDX-License-Identifier: Apache-2.0
#
# trust-vc is a submodule of Trust (the rustc fork); the whole workspace builds
# with the Trust toolchain (see the root rust-toolchain.toml). The `driver`
# module links the fork's unstable `rustc_private` libraries, so it targets the
# Trust toolchain's rustc API (`run_compiler`, `tcx.hir_free_items()` / `hir_item`
# / `hir_attrs`, `Attribute::name()`), NOT a stock nightly — stock nightlies'
# rustc internals differ from the fork's.
#
# `rustc-dev` is not a rustup component on the linked `trust` toolchain: the
# rustc_private rlibs + matching host proc-macro dylibs live in the fork's
# `build/` tree and are put on rustc's `-L` search path by
# `scripts/build-trust-vc-driver.sh` (with `RUSTC_BOOTSTRAP=1`). Building the
# `rustc-driver` feature with a bare `cargo build` will NOT resolve `rustc_*` —
# use that script. The default-feature `lower` layer builds on this toolchain
# with a plain `cargo build`/`cargo test`.

[toolchain]
channel = "trust"
