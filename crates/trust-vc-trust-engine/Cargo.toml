[package]
name = "trust-vc-trust-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Programmatic TrustVc adapter boundary for tRust verifier concepts"

[dependencies]
trust-vc-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
trust-ir = { workspace = true, features = ["serde", "binary"] }
# INPUT GATE: the producer validator. See the workspace note. Also
# `coverage_establishment_report`: release admission of a certificate's
# coverage (src/native_coverage.rs) admits only what trust-ir-build derives
# from the kernel replay of that very certificate (basis K).
trust-ir-build = { workspace = true }

# One IR-owned wire codec in production, not a copied JSON-tag interpretation.
trust-ir-contract = { workspace = true }

[dev-dependencies]
# `binary` makes the codec's `VERSION` public, so tests/trust_ir_pin_label.rs
# can read the wire version of the trust-ir the tests link. The codec itself is
# compiled either way. `parser` lets the tensor refusal tests spell each
# tensor instruction in trust-ir's own text grammar.
trust-ir = { workspace = true, features = ["serde", "binary", "parser"] }

[features]
default = []
proof-certificates = ["trust-vc-core/proof-certificates"]

[lints]
workspace = true
