[package]
name = "trust-vc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proc macros for Verus-style verification with ay backend"

[lib]
proc-macro = true

[features]
default = []
trust_mc = ["trust-vc-core/trust_mc"]
ty = ["trust-vc-core/ty"]
named-assertions = ["trust-vc-core/named-assertions"]
expensive-tests = []  # Gate slow solver-bound integration tests (#2658)

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
trust-vc-core = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
# Protocol components declared in other crates
# (`tests/protocol_component_in_other_crate_soundness.rs`).
trust-vc-protocol-fixture-mc = { path = "tests/protocol-fixtures/mc" }
trust-vc-protocol-fixture-plain = { path = "tests/protocol-fixtures/plain" }
serde_json = { workspace = true }
# `assert_forall_by_rs_trust_vc_regressions` re-derives an obligation
# fingerprint (sha256 of the rendered condition text) so the engine's rendering
# and the manifest pin cannot drift apart unnoticed.
sha2 = { workspace = true }
trust-vc-types = { workspace = true }

[lints]
workspace = true

[[test]]
name = "mode_exec_calls_exec"
path = "tests/compile-pass/mode/exec_calls_exec.rs"
harness = false

