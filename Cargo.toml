# TrustVc - Verus-style Rust verifier with ay backend; replacement proof is evidence-gated
#
# Copyright 2026 Andrew Yates
# SPDX-License-Identifier: Apache-2.0
# Author: Andrew Yates <andrewyates.name@gmail.com>

[workspace]
members = [
  "crates/cargo-trust-vc",
  "crates/trust-vc",
  "crates/trust-vc-core",
  "crates/trust-vc-bitvector",
  "crates/trust-vc-driver",
  "crates/trust-vc-kernel",
  "crates/trust-vc-merge-contract",
  "crates/trust-vc-merge-runner",
  "crates/trust-vc-oracle",
  "crates/trust-vc-rustc",
  "crates/trust-vc-std",
  "crates/trust-vc-trust-engine",
  "crates/trust-vc-types",
  "crates/trust-vc-vcir",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/trust-vc"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

# Centralized dependencies.
[workspace.dependencies]
trust-vc-bitvector = { path = "crates/trust-vc-bitvector" }
# Owned dependency stack consumed as git deps so trust-vc builds standalone from
# any location. A single git source per crate avoids duplicate package
# identities.
#
# ay pin — tiers. `alabsystems/ay` is the DEV tier (agents push it freely);
# `alabsystems/ay` is the PUBLIC release tier, which only a human can write via
# `pub promote`. The public tier may lag the dev authority, so the pin below
# names the dev tier. Publication remaps an attested dev revision to the
# corresponding public snapshot; never guess that mapping here.
#
# Pinned to one immutable canonical Git revision. Move the package version and
# all four revisions together; Cargo.lock records that same Git source for the
# complete AY closure. Normal resolution uses Cargo's authenticated checkout,
# without a sibling-worktree redirect.
ay-core = { version = "0.28.4", git = "https://github.com/alabsystems/ay.git", rev = "12d411d420e27eea05099f8cd277eb288e8622c9" }
ay-dpll = { version = "0.28.4", git = "https://github.com/alabsystems/ay.git", rev = "12d411d420e27eea05099f8cd277eb288e8622c9" }
ay-frontend = { version = "0.28.4", git = "https://github.com/alabsystems/ay.git", rev = "12d411d420e27eea05099f8cd277eb288e8622c9" }
ay-sys = { version = "0.28.4", git = "https://github.com/alabsystems/ay.git", rev = "12d411d420e27eea05099f8cd277eb288e8622c9" }
# trust-ir is rev-pinned (not branch=main) for reproducible standalone builds;
# its three legs below move together. No ty crate is linked: the protocol
# lane runs the `ty` binary (`trust-vc-core/src/protocol/`).
trust-ir = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe", default-features = false, features = ["clean-expr"] }
# The PRODUCER's own validator, used by the discharge lane as an INPUT GATE.
# `trust-ir-build::validate_module` is the well-formedness authority for the
# format this crate consumes; adversarial review rounds 1-4 each found a
# false-`Discharged` path whose shape that validator ALREADY rejects. Running it
# on every incoming bundle closes the class instead of the instance. Unlike
# `trust-ir-contract` below, this is NOT a dev-dependency: the gate must run in
# the shipped library, and Trust's `[patch]` tables already cover `trust-ir-build`
# (see the note below), so it introduces no second package identity there.
# Keep the rev byte-identical to `trust-ir`'s: two revs would give the validator
# a different `Module` type than the one it validates.
# trust-vc-trust-engine also calls its `coverage_establishment_report` (basis K
# only) so that release admission of a certificate's coverage is DERIVED from
# the kernel replay of that very certificate by trust-ir-build's own rule, never
# read from a producer-written row and never re-implemented here. It enables
# `trust-ir/fmt` (the obligation/context digests) itself. Its default
# `clean-tv-anchor` feature is needed: without it the Clean-kernel contract
# re-check always fails closed, so neither the input gate nor basis K could
# accept a CleanCic certificate that does re-check.
trust-ir-build = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe" }
# The native engine decodes the shared question with the IR-owned Formula/Sort
# codec. Keep the exact source identical to trust-ir and trust-ir-build above.
trust-ir-contract = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe" }

# BigInt for 128-bit bitvector constants
num-bigint = "0.4"

# Proc macro support
syn = { version = "2", features = ["full", "parsing", "visit", "visit-mut", "fold"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-crate = "3"

# Internal crates
trust-vc-core = { path = "crates/trust-vc-core" }
trust-vc-merge-contract = { path = "crates/trust-vc-merge-contract" }
trust-vc-oracle = { path = "crates/trust-vc-oracle" }
trust-vc-kernel = { path = "crates/trust-vc-kernel" }
trust-vc-merge-runner = { path = "crates/trust-vc-merge-runner" }
trust-vc-trust-engine = { path = "crates/trust-vc-trust-engine" }
trust-vc-types = { path = "crates/trust-vc-types" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustdoc-types = "0.60.0"
libc = "0.2"

# Logging
tracing = "0.1"
stacker = "0.1"

# Error handling
thiserror = "2"

# CLI UX
indicatif = "0.17"

# Testing
trybuild = "1"
inventory = "0.3"
proptest = "1"

[workspace.lints.rust]
# cfg(trust_mc) is used intentionally for verification-only code paths.
# cfg(trust_vc_driver) is emitted by the contract macros as the rustc-driver
# surface-bridge marker gate (see trust_vc_core::__driver_markers); the driver's
# run() injects `--cfg trust_vc_driver`, but the macro-expanded arms carrying it
# are compiled by every consumer, so the cfg must be registered here too.
# These warnings are expected and should be silenced.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(trust_mc)", "cfg(trust_vc_driver)"] }

[profile.dev]
incremental = true

# The ay solver stack runs UNCONDITIONAL soundness self-checks (e.g. the Cooper
# QE ground-battery equivalence check, ay b8807717-era deep-QE pre-pass) whose
# cost under an unoptimized dev build turns minutes-long test suites into
# hours. The solver is the inner loop of every verification — always compile
# it (and its bignum substrate) optimized, dev profile included.
# MEASURED 2026-09-16 (solver-red capture, ledger row of that date): naming only
# the four ay façade crates plus num-bigint left every OTHER crate of the ay
# stack (ay-sat, ay-proof, ay-theories, ay-model-check, …) at opt-level 0 in
# dev/test builds — the bit-blasted QF_BV obligations (multiplication-overflow
# and division checks) then ran 10-100× slower than the same query through a
# release `ay` CLI and tripped the 30 s wall. ay's own workspace compiles all
# non-member packages optimized (`[profile.dev.package."*"]`); do the same
# here. Build-config only: no semantic effect on any verdict.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"

[workspace.metadata.atpkg]
# The user-facing commands here, both produced by crate cargo-trust-vc and both
# runnable with NOTHING installed — they parse sources with syn and discharge
# the proof obligations on `ay` in-process, with no cargo, rustc, sysroot or
# external solver involved at runtime:
#
#   * `trust-vc` — the one-word verifier. `trust-vc <FILE.rs>` or
#     `trust-vc <CRATE-DIR>` verifies immediately; `trust-vc example > demo.rs`
#     writes a sample it can verify, so a first run needs no setup at all.
#   * `cargo-trust-vc` — the same CLI as a cargo subcommand: shimmed onto PATH
#     it runs directly as `cargo-trust-vc check <crate>`, and cargo also
#     discovers the same shim as `cargo trust-vc check`.
#
# Nothing else in this workspace is a command: `trust-vc-driver` is a rustc
# driver linking rustc_private (its required-features already keep it out of a
# release build — never add it here); `trust_vc-trust-runner` and
# `trust-vc-merge-runner` are JSON request/bundle endpoints for Trust ingest and
# the merge parity gate; `generate_fixtures` / `generate_api_surface_fixtures`
# write this checkout's own test fixtures.
expose = ["cargo-trust-vc", "trust-vc"]
# Build only the CLI and its dependency closure; a bare `cargo build --release`
# would also compile the ghost-type/std/oracle/merge crates for bins we do not
# ship. `-p cargo-trust-vc` produces BOTH exposed bins — they are two targets of
# that one package.
build-args = ["-p", "targo-trust-vc"]

# Trust: policy for `targo trust` over this workspace.
[trust]
# No budget key: Trust retired `function_budget_ms` (its DECISION_QUEUE
# BUDGET-1a; Trust 0.11.0 refuses the key here as an unknown field), so a
# `targo trust` run of this workspace uses the toolchain's builtin clocks.
