# TrustVc - Verus-style Rust verifier with ay backend; replacement proof is evidence-gated
#
# Copyright 2026 Andrew Yates
# SPDX-License-Identifier: Apache-2.0
# Author: Andrew Yates <andrewyates.name@gmail.com>

[workspace]
members = [
  "crates/cargo-trust-vc",
  "crates/trust-vc",
  "crates/trust-vc-core",
  "crates/trust-vc-driver",
  "crates/trust-vc-kernel",
  "crates/trust-vc-merge-contract",
  "crates/trust-vc-merge-runner",
  "crates/trust-vc-oracle",
  "crates/trust-vc-std",
  "crates/trust-vc-trust-engine",
  "crates/trust-vc-types",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/trust-vc"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

# Centralized dependencies.
[workspace.dependencies]
# Owned dependency stack consumed as git deps so trust-vc builds standalone from
# any location. A single git source per crate avoids duplicate package
# identities.
#
# ay pin — tiers. `alabsystems/ay` is the DEV tier (agents push it freely);
# `alabsystems/ay` is the PUBLIC release tier, which only a human can write via
# `pub promote`. alabsystems has published only up to v0.13.0's predecessor, so
# the pin below names the dev tier. Flip the URL to
# `https://github.com/alabsystems/ay.git` (same rev) once a human promotes
# v0.13.0 there.
#
# Pinned to a 40-HEX SHA — never a tag, never branch=main. A tag is a MOVING
# selector: the constellation's own gates reject it outright (ty's
# `check_reproducible_git_pins.py`, trust-mc's `check_first_party_git_pins.py`,
# clean's `check_ay_updates.py` and `publish/transform.py` all hard-require
# `^[0-9a-fA-F]{40}$`). The sha below is ay tag v0.13.0.
#
# The `version` req must MOVE WITH ay on every bump: cargo checks a [patch]ed
# source against it, and a stale req does NOT merely drift — cargo SILENTLY
# DROPS the whole [patch] and resolves the git pin instead, emitting only
# `warning: patch ... was not used in the crate graph` with exit 0. That is how
# the 0.11.0 req survived ay's 0.11 -> 0.12 -> 0.13 releases while every local
# gate secretly measured the pinned git source rather than `../ay`. Verify
# after any bump: `targo metadata` must show the ay crates resolving to PATH
# and print ZERO "was not used in the crate graph" warnings.
# (`+g<sha>` build metadata does NOT help — cargo ignores build metadata when
# matching versions; only a MINOR bump makes a mismatch fail loudly.)
#
# NOTE: `.cargo/config.toml` [patch]es all four to the sibling `../ay` checkout,
# so this pin is NOT what local builds compile — it is what a standalone clone
# would fetch. Bump all four together with ../ay's [workspace.package] version.
ay-core = { version = "0.13.0", git = "https://github.com/alabsystems/ay.git", rev = "a533b9ebf54427ff4a375b15579f2f7d2298d601" }
ay-dpll = { version = "0.13.0", git = "https://github.com/alabsystems/ay.git", rev = "a533b9ebf54427ff4a375b15579f2f7d2298d601" }
ay-frontend = { version = "0.13.0", git = "https://github.com/alabsystems/ay.git", rev = "a533b9ebf54427ff4a375b15579f2f7d2298d601" }
ay-sys = { version = "0.13.0", git = "https://github.com/alabsystems/ay.git", rev = "a533b9ebf54427ff4a375b15579f2f7d2298d601" }
# ty and trust-ir are rev-pinned (not branch=main) for reproducible standalone
# builds. ty's internal tla-ir -> trust-ir-build dependencies still name
# trust-ir's main branch, so Cargo.lock must pin those branch sources to the
# same trust-ir commit as the direct dependency. Update both sources together.
tla-core = { git = "https://github.com/alabsystems/ty.git", rev = "21a31de828a2b99f40fdff0ac0f0569244182609" }
tla-check = { git = "https://github.com/alabsystems/ty.git", rev = "21a31de828a2b99f40fdff0ac0f0569244182609" }
trust-ir = { git = "https://github.com/alabsystems/trust-ir.git", rev = "32a2c54b555c884a40020093f5910cbb5e2050ab", default-features = false, features = ["clean-expr"] }

# BigInt for 128-bit bitvector constants
num-bigint = "0.4"

# Proc macro support
syn = { version = "2", features = ["full", "parsing", "visit", "visit-mut", "fold"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-crate = "3"

# Internal crates
trust-vc-core = { path = "crates/trust-vc-core" }
trust-vc-merge-contract = { path = "crates/trust-vc-merge-contract" }
trust-vc-oracle = { path = "crates/trust-vc-oracle" }
trust-vc-kernel = { path = "crates/trust-vc-kernel" }
trust-vc-merge-runner = { path = "crates/trust-vc-merge-runner" }
trust-vc-trust-engine = { path = "crates/trust-vc-trust-engine" }
trust-vc-types = { path = "crates/trust-vc-types" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustdoc-json-stable = "0.9.7"
rustdoc-types = "0.57.3"
libc = "0.2"

# Logging
tracing = "0.1"
stacker = "0.1"

# Error handling
thiserror = "2"

# CLI UX
indicatif = "0.17"

# Testing
trybuild = "1"
inventory = "0.3"
proptest = "1"

[workspace.lints.rust]
# cfg(trust_mc) is used intentionally for verification-only code paths.
# cfg(trust_vc_driver) is emitted by the contract macros as the rustc-driver
# surface-bridge marker gate (see trust_vc_core::__driver_markers); the driver's
# run() injects `--cfg trust_vc_driver`, but the macro-expanded arms carrying it
# are compiled by every consumer, so the cfg must be registered here too.
# These warnings are expected and should be silenced.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(trust_mc)", "cfg(trust_vc_driver)"] }

[profile.dev]
incremental = true

# The ay solver stack runs UNCONDITIONAL soundness self-checks (e.g. the Cooper
# QE ground-battery equivalence check, ay b8807717-era deep-QE pre-pass) whose
# cost under an unoptimized dev build turns minutes-long test suites into
# hours. The solver is the inner loop of every verification — always compile
# it (and its bignum substrate) optimized, dev profile included.
[profile.dev.package.ay-core]
opt-level = 3
[profile.dev.package.ay-dpll]
opt-level = 3
[profile.dev.package.ay-frontend]
opt-level = 3
[profile.dev.package.ay-sys]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3

[profile.release]
strip = "debuginfo"

# Local cross-repo co-development override: sibling [patch] redirects for the ay
# git deps above live in `.cargo/config.toml`, which IS TRACKED and IS ACTIVE —
# so a clone of trust-vc REQUIRES a sibling `../ay` checkout, and local builds
# compile that working tree rather than the rev pinned above. Keep each override
# keyed to the exact git source above, and keep the `version` reqs in step with
# ../ay, so Cargo retains a single package identity per owned crate and does not
# silently drop the patch. See that file's header for the full failure mode.

[workspace.metadata.atpkg]
# The user-facing commands here, both produced by crate cargo-trust-vc and both
# runnable with NOTHING installed — they parse sources with syn and discharge
# the proof obligations on `ay` in-process, with no cargo, rustc, sysroot or
# external solver involved at runtime:
#
#   * `trust-vc` — the one-word verifier. `trust-vc <FILE.rs>` or
#     `trust-vc <CRATE-DIR>` verifies immediately; `trust-vc example > demo.rs`
#     writes a sample it can verify, so a first run needs no setup at all.
#   * `cargo-trust-vc` — the same CLI as a cargo subcommand: shimmed onto PATH
#     it runs directly as `cargo-trust-vc check <crate>`, and cargo also
#     discovers the same shim as `cargo trust-vc check`.
#
# Nothing else in this workspace is a command: `trust-vc-driver` is a rustc
# driver linking rustc_private (its required-features already keep it out of a
# release build — never add it here); `trust_vc-trust-runner` and
# `trust-vc-merge-runner` are JSON request/bundle endpoints for Trust ingest and
# the merge parity gate; `generate_fixtures` / `generate_api_surface_fixtures`
# write this checkout's own test fixtures.
expose = ["cargo-trust-vc", "trust-vc"]
# Build only the CLI and its dependency closure; a bare `cargo build --release`
# would also compile the ghost-type/std/oracle/merge crates for bins we do not
# ship. `-p cargo-trust-vc` produces BOTH exposed bins — they are two targets of
# that one package.
build-args = ["-p", "targo-trust-vc"]
