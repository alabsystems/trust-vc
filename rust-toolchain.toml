[toolchain]
# Owner directive 2026-09-28: ALab systems build with the Trust toolchain.
# This pin only names the channel for rustup-aware tools (rust-analyzer, IDEs).
# `targo` picks the lane (`targo --unverified <cmd>` or `targo trust <cmd>`),
# not this file. The older sealed-link registration notes are obsolete; they
# remain in the development history.
channel = "trust"
